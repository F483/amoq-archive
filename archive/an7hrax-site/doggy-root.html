<script language="JavaScript"><!--
// Hide this script from old browsers --
var speed = 20 
var pause = 2500 
var timerID = null
var bannerRunning = false
var ar = new Array()

ar[0] = "Welcome To digital dogart "
ar[1] = "The Art For Dogs ;))"
ar[2] = "View My Gallery"
ar[3] = "PhotoShop, Bryce, 3DMax and more"
ar[4] = "Enjoy surfin' and Have Fun!"

var message = 0
var state = ""
clearState()
function stopBanner() {
        if (bannerRunning)
                clearTimeout(timerID)
        bannerRunning = false
}

function startBanner() {
        stopBanner()
        showBanner()
}
function clearState() {
        state = ""
        for (var i = 0; i < ar[message].length; ++i) {
                state += "0"
        }
}
function showBanner() {
        if (getString()) {
                message++
                if (ar.length <= message)
                        message = 0
                clearState()
                timerID = setTimeout("showBanner()", pause)
                bannerRunning = true
        } else {
                var str = ""
                for (var j = 0; j < state.length; ++j) {
                        str += (state.charAt(j) == "1") ? ar[message].charAt(j) : "     "
                }
                window.status = str
                timerID = setTimeout("showBanner()", speed)
                bannerRunning = true
        }
}
function getString() {
        var full = true
        for (var j = 0; j < state.length; ++j) {
                if (state.charAt(j) == 0)
                        full = false
        }
        if (full)
                return true
        while (1) {
                var num = getRandom(ar[message].length)
                if (state.charAt(num) == "0")
                        break
        }
        state = state.substring(0, num) + "1" + state.substring(num + 1, state.length)
        return false
}
function getRandom(max) {
        return Math.round((max - 1) * Math.random())
}
// -- End Hiding Here 
// --></script>
